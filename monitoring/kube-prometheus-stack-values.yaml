# Kept in sync with helm/observability/values.yaml (kube-prometheus-stack key).
# Prefer installing the umbrella chart.

prometheus:
  service:
    type: ClusterIP

  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}

    enableFeatures:
      - exemplar-storage

    retention: 15d
    scrapeInterval: 15s

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  service:
    type: ClusterIP

  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      receiver: slack-notifications
      routes:
        - matchers:
            - severity = critical
          receiver: slack-notifications
          continue: true
        - matchers:
            - severity = warning
          receiver: slack-notifications
    receivers:
      - name: slack-notifications
        slack_configs:
          - api_url: "<YOUR_SLACK_WEBHOOK_URL>"
            channel: "#shoplite-alerts"
            send_resolved: true
            title: "{{ .Status | toUpper }} - {{ .CommonLabels.alertname }}"
            text: |-
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Severity:* {{ .Labels.severity }}
              *Runbook:* {{ .Annotations.runbook_url }}
              {{ end }}

grafana:
  adminPassword: admin
  grafana.ini:
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
  persistence:
    enabled: true
    storageClassName: gp3
    size: 5Gi
  service:
    type: NodePort
    nodePort: 30300
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      jsonData:
        derivedFields:
          - name: TraceID
            matcherRegex: '"trace_id":"([a-f0-9]+)"'
            datasourceUid: tempo
            url: "$${__value.raw}"
            urlDisplayLabel: View Trace
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-1h"
          spanEndTimeShift: "1h"
          filterByTraceID: true
        tracesToMetrics:
          datasourceUid: prometheus
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
        lokiSearch:
          datasourceUid: loki

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
