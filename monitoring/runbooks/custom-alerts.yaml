apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: k3s-cluster-health
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: node-health
      interval: 30s
      rules:
        - alert: NodeDown
          expr: up{job="node-exporter"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.instance }} is down"
            description: "Node exporter on {{ $labels.instance }} has been unreachable for more than 2 minutes."

        - alert: NodeHighCPU
          expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage on {{ $labels.instance }}"
            description: "CPU usage is above 85% (current value: {{ $value | humanize }}%) on {{ $labels.instance }}."

        - alert: NodeHighMemory
          expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on {{ $labels.instance }}"
            description: "Memory usage is above 85% (current value: {{ $value | humanize }}%) on {{ $labels.instance }}."

    - name: cluster-health
      interval: 30s
      rules:
        - alert: TooFewReadyNodes
          expr: sum(kube_node_status_condition{condition="Ready",status="true"}) < 3
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Fewer than 3 Ready nodes in the cluster"
            description: "Only {{ $value }} node(s) are currently Ready. Expected at least 3."
