prometheus:
  # Expose Prometheus UI on NodePort so you can hit it from your browser
  # without needing kubectl port-forward (which drops idle connections and
  # dies on every pod rollout).
  service:
    type: NodePort
    nodePort: 30090

  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    retention: 15d
    scrapeInterval: 30s

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # Custom scrape configs — scrape targets outside ServiceMonitor scope.
    additionalScrapeConfigs:
      - job_name: 'kubernetes-apiserver-direct'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https


alertmanager:
  # Expose Alertmanager UI on NodePort (same rationale as Prometheus above).
  service:
    type: NodePort
    nodePort: 30093

  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'cluster', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      receiver: 'slack-notifications'
      routes:
        - match:
            severity: critical
          receiver: 'slack-notifications'
          continue: true
    receivers:
      - name: 'slack-notifications'
        slack_configs:
          - api_url: '<YOUR_SLACK_WEBHOOK_URL>'
            channel: '#k3s-cluster-alerts'
            send_resolved: true
            title: '{{ .Status | toUpper }} - {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Severity:* {{ .Labels.severity }}
              *Node:* {{ .Labels.instance }}
              {{ end }}

grafana:
  adminPassword: admin
  persistence:
    enabled: true
    size: 5Gi
  service:
    type: NodePort
    nodePort: 30080

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true