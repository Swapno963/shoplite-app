namespace: shoplite

imagePullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: shoplite

ingress:
  enabled: true
  className: nginx
  host: shoplite.local

web:
  replicaCount: 2
  image:
    repository: 051826735078.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite-web
    tag: latest
  service:
    port: 80
    targetPort: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

catalogApi:
  replicaCount: 2
  image:
    repository: 051826735078.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite-catalog-api
    tag: latest
  service:
    port: 8080
    targetPort: 8080
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  probes:
    livenessPath: /healthz
    readinessPath: /readyz

orderWorker:
  replicaCount: 1
  image:
    repository: 051826735078.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite-order-worker
    tag: latest
  terminationGracePeriodSeconds: 300
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

postgres:
  image:
    repository: postgres
    tag: "16"
  database: shoplite
  username: shoplite
  storage: 20Gi
  storageClass: gp3
  service:
    port: 5432

redis:
  image:
    repository: redis
    tag: "7"
  service:
    port: 6379

applicationConfig:
  LOG_LEVEL: INFO
  CACHE_TTL_SECONDS: "300"
  FEATURE_FLAG_RECOMMENDATIONS: "true"
  DJANGO_DEBUG: "false"
  ALLOWED_HOSTS: "*"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "shoplite"
  POSTGRES_USER: "shoplite"
  REDIS_URL: "redis://redis:6379/0"
  ORDERS_QUEUE: "orders:pending"
  CHAOS_LATENCY_MS: "0"
  CHAOS_ERROR_RATE: "0"
  CHAOS_MEMORY_LEAK: "false"
  CHAOS_SLOW_DB: "false"
  VITE_API_URL: "/api"

# Created outside Helm:
#   kubectl create secret generic shoplite-secret -n shoplite \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=DJANGO_SECRET_KEY=... \
#     --from-literal=REDIS_PASSWORD=...
secrets:
  existingSecret: shoplite-secret
