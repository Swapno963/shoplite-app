apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-worker
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.orderWorker.replicaCount }}

  selector:
    matchLabels:
      app: order-worker

  template:
    metadata:
      labels:
        app: order-worker

    spec:

      serviceAccountName: {{ .Values.serviceAccount.name }}

      terminationGracePeriodSeconds: {{ .Values.orderWorker.terminationGracePeriodSeconds }}

      containers:

        - name: order-worker

          image: "{{ .Values.orderWorker.image.repository }}:{{ .Values.orderWorker.image.tag }}"

          imagePullPolicy: {{ .Values.imagePullPolicy }}

          envFrom:

            - configMapRef:
                name: shoplite-config

            - secretRef:
                name: {{ .Values.secrets.existingSecret }}

          resources:
{{ toYaml .Values.orderWorker.resources | indent 12 }}

          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "sleep 20"

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "true"

            initialDelaySeconds: 5
            periodSeconds: 15

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "true"

            initialDelaySeconds: 30
            periodSeconds: 30