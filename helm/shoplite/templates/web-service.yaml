# yamllint disable-file
apiVersion: v1
kind: Service

metadata:
  name: web
  namespace: {{ .Values.namespace }}

spec:
  type: ClusterIP

  selector:
    app: web

  ports:
    - name: http

      port: {{ .Values.web.service.port }}

      targetPort: {{ .Values.web.service.targetPort }}

      protocol: TCP
