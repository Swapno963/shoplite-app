apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres
  namespace: {{ .Values.namespace }}

spec:

  serviceName: postgres

  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:

      serviceAccountName: {{ .Values.serviceAccount.name }}

      containers:

        - name: postgres

          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"

          ports:

            - containerPort: 5432
              name: postgres

          env:

            - name: POSTGRES_DB
              value: "{{ .Values.postgres.database }}"

            - name: POSTGRES_USER
              value: "{{ .Values.postgres.username }}"

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: POSTGRES_PASSWORD

          volumeMounts:

            - name: postgres-data
              mountPath: /var/lib/postgresql/data

          resources:

            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1000m"
              memory: "2Gi"

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.username }}

            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.username }}

            initialDelaySeconds: 30
            periodSeconds: 20

  volumeClaimTemplates:

    - metadata:
        name: postgres-data

      spec:

        accessModes:
          - ReadWriteOnce

        resources:

          requests:
            storage: {{ .Values.postgres.storage }}