# yamllint disable-file
apiVersion: v1
kind: Service

metadata:
  name: catalog-api
  namespace: {{ .Values.namespace }}

spec:
  type: ClusterIP

  selector:
    app: catalog-api

  ports:
    - name: http

      port: {{ .Values.catalogApi.service.port }}

      targetPort: {{ .Values.catalogApi.service.targetPort }}

      protocol: TCP
