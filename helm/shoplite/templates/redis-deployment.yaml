apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis
  namespace: {{ .Values.namespace }}

spec:

  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:

    metadata:
      labels:
        app: redis

    spec:

      serviceAccountName: {{ .Values.serviceAccount.name }}

      containers:

        - name: redis

          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"

          imagePullPolicy: {{ .Values.imagePullPolicy }}

          ports:
            - containerPort: 6379

          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            tcpSocket:
              port: 6379

            initialDelaySeconds: 20
            periodSeconds: 15

          readinessProbe:
            tcpSocket:
              port: 6379

            initialDelaySeconds: 5
            periodSeconds: 10

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false