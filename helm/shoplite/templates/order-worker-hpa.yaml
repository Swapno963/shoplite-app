# yamllint disable-file
{{- if .Values.orderWorker.hpa.enabled }}

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: order-worker
  namespace: {{ .Values.namespace }}

spec:

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-worker

  minReplicas: {{ .Values.orderWorker.hpa.minReplicas }}

  maxReplicas: {{ .Values.orderWorker.hpa.maxReplicas }}

  metrics:

    - type: Resource

      resource:

        name: cpu

        target:
          type: Utilization

          averageUtilization: {{ .Values.orderWorker.hpa.targetCPUUtilizationPercentage }}

{{- end }}
