apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shoplite-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    app: shoplite
    release: kube-prometheus-stack
spec:
  groups:
    - name: shoplite.golden-signals
      interval: 30s
      rules:
        - alert: HighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{status=~"5.."}[5m]))
              /
              clamp_min(sum(rate(http_requests_total[5m])), 0.001)
            ) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: HTTP 5xx error rate is above 5%
            description: >-
              ShopLite HTTP 5xx rate is {{ "{{" }} $value | humanizePercentage {{ "}}" }}
              over the last 5 minutes.
            runbook_url: https://github.com/Swapno963/shoplite-app/blob/long-term-ecr-permission-solution/monitoring/runbooks/high-error-rate.md

        - alert: HighLatency
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket[5m]))
            ) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: p95 HTTP latency is above 1s
            description: >-
              ShopLite p95 request latency is {{ "{{" }} $value | humanizeDuration {{ "}}" }}.
            runbook_url: https://github.com/Swapno963/shoplite-app/blob/long-term-ecr-permission-solution/monitoring/runbooks/high-latency.md

        - alert: QueueBacklog
          expr: max(order_queue_depth) > 50
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Order queue depth is above 50
            description: >-
              Redis order queue depth is {{ "{{" }} $value {{ "}}" }} pending messages.
            runbook_url: https://github.com/Swapno963/shoplite-app/blob/long-term-ecr-permission-solution/monitoring/runbooks/queue-backlog.md

        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="shoplite"}[10m]) > 0
          labels:
            severity: critical
          annotations:
            summary: Pod {{ "{{" }} $labels.pod {{ "}}" }} is crash-looping
            description: >-
              Container {{ "{{" }} $labels.container {{ "}}" }} in pod {{ "{{" }} $labels.pod {{ "}}" }}
              restarted {{ "{{" }} $value {{ "}}" }} times in the last 10 minutes.
            runbook_url: https://github.com/Swapno963/shoplite-app/blob/long-term-ecr-permission-solution/monitoring/runbooks/pod-crash-looping.md

        - alert: NodeDiskFilling
          expr: |
            (
              1 - (
                node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
                /
                node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}
              )
            ) > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Disk usage on {{ "{{" }} $labels.instance {{ "}}" }} is above 85%
            description: >-
              Filesystem {{ "{{" }} $labels.mountpoint {{ "}}" }} on {{ "{{" }} $labels.instance {{ "}}" }}
              is {{ "{{" }} $value | humanizePercentage {{ "}}" }} full.
            runbook_url: https://github.com/Swapno963/shoplite-app/blob/long-term-ecr-permission-solution/monitoring/runbooks/node-disk-filling.md
