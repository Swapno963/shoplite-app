---
extends: default

# Helm templates are Go text, not YAML, until `helm template` renders them.
# CI already runs `helm lint` / `helm template` on the chart.
ignore: |
  /helm/shoplite/templates/

rules:
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
  truthy:
    allowed-values: ["true", "false", "yes", "no"]
  comments:
    min-spaces-from-content: 1
  document-start: disable
