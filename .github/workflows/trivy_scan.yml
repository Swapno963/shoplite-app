name: Security Scan

on:
  push:
    branches:
      - test-application

jobs:
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Short SHA
        run: |
          echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build catalog-api
        run: |
          docker build -t catalog-api:${SHA} ./application/catalog-api

      - name: Build web
        run: |
          docker build -t web:${SHA} ./application/web

      - name: Build order-worker
        run: |
          docker build -t order-worker:${SHA} ./application/order-worker

      - name: Scan catalog-api
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: catalog-api:${{ env.SHA }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.69.3

      - name: Scan web
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: web:${{ env.SHA }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.69.3

      - name: Scan order-worker
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: order-worker:${{ env.SHA }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.69.3

  grype-scan:
    name: Grype Scan
    runs-on: ubuntu-latest
    needs: trivy-scan

    steps:
      - uses: actions/checkout@v4

      - name: Get SHA
        run: |
          echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Install Grype
        run: |
          curl -sSfL \
          https://raw.githubusercontent.com/anchore/grype/main/install.sh \
          | sh -s -- -b /usr/local/bin

      - name: Build catalog-api
        run: |
          docker build -t catalog-api:${SHA} ./application/catalog-api

      - name: Scan catalog-api
        run: |
          grype catalog-api:${SHA} \
          --fail-on critical

      - name: Build web
        run: |
          docker build -t web:${SHA} ./application/web

      - name: Scan web
        run: |
          grype web:${SHA} \
          --fail-on critical

      - name: Build order-worker
        run: |
          docker build -t order-worker:${SHA} ./application/order-worker

      - name: Scan order-worker
        run: |
          grype order-worker:${SHA} \
          --fail-on critical
