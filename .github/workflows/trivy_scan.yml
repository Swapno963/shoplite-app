  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Short SHA
        run: |
          echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build catalog-api
        run: |
          docker build -t catalog-api:${SHA} ./catalog-api

      - name: Build web
        run: |
          docker build -t web:${SHA} ./web

      - name: Build order-worker
        run: |
          docker build -t order-worker:${SHA} ./order-worker

      - name: Install Trivy
        uses: aquasecurity/trivy-action@0.28.0

      - name: Scan catalog-api
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: catalog-api:${{ env.SHA }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan web
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: web:${{ env.SHA }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan order-worker
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: order-worker:${{ env.SHA }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  grype-scan:
    name: Grype Scan
    runs-on: ubuntu-latest
    needs: trivy-scan

    steps:
      - uses: actions/checkout@v4

      - name: Get SHA
        run: |
          echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Install Grype
        run: |
          curl -sSfL \
          https://raw.githubusercontent.com/anchore/grype/main/install.sh \
          | sh -s -- -b /usr/local/bin

      - name: Build catalog-api
        run: |
          docker build -t catalog-api:${SHA} ./catalog-api

      - name: Scan catalog-api
        run: |
          grype catalog-api:${SHA} \
          --fail-on critical

      - name: Build web
        run: |
          docker build -t web:${SHA} ./web

      - name: Scan web
        run: |
          grype web:${SHA} \
          --fail-on critical

      - name: Build order-worker
        run: |
          docker build -t order-worker:${SHA} ./order-worker

      - name: Scan order-worker
        run: |
          grype order-worker:${SHA} \
          --fail-on critical