name: Build Web

on:
  push:
    branches:
      - main

    paths:
      - 'application/web/**'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Debug GitHub OIDC context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository ID: ${{ github.repository_id }}"
          echo "Owner ID: ${{ github.repository_owner_id }}"
          echo "Branch: $GITHUB_REF"

      - name: Print GitHub Context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Repository ID: ${{ github.repository_id }}"
      - name: Debug Context
        run: |
          echo "Repository=${{ github.repository }}"
          echo "Repository ID=${{ github.repository_id }}"
          echo "Owner=${{ github.repository_owner }}"
          echo "Ref=${{ github.ref }}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build
        run: |
          docker build \
            -t shoplite-web:${{ github.sha }} \
            application/web

      - name: Push
        run: |
          docker tag shoplite-web:${{ github.sha }} \
          051826735078.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite-web:${{ github.sha }}

          docker tag shoplite-web:${{ github.sha }} \
          051826735078.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite-web:stable

          docker push \
          051826735078.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite-web:${{ github.sha }}

          docker push \
          051826735078.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite-web:stable
