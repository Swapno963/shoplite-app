name: Build Web

on:
  push:
    branches:
      - gitOps

    paths:
      - 'application/web/**'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Debug Role
        run: |
          echo "AWS Role ARN: ${{ secrets.AWS_ROLE_ARN }}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build
        run: |
          docker build \
            -t shoplite-web:${{ github.sha }} \
            application/web

      - name: Push
        run: |
          docker tag shoplite-web:${{ github.sha }} \
          051826735078.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite-web:${{ github.sha }}

          docker tag shoplite-web:${{ github.sha }} \
          051826735078.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite-web:stable

          docker push \
          051826735078.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite-web:${{ github.sha }}

          docker push \
          051826735078.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite-web:stable

      - name: Checkout GitOps
        uses: actions/checkout@v4
        with:
          repository: Swapno963/shoplite-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Bump GitOps image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cd gitops
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            current=$(yq -r '.web.image.tag' envs/dev/values.yaml)
            if [ "$current" = "$IMAGE_TAG" ]; then
              echo "GitOps already at $IMAGE_TAG"
              exit 0
            fi

            yq -i '.web.image.tag = strenv(IMAGE_TAG)' envs/dev/values.yaml
            git add envs/dev/values.yaml
            git commit -m "Bump web image to ${IMAGE_TAG}"

            if git push origin main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}, retrying..."
            sleep $((attempt * 2))
          done

          echo "Failed to push GitOps tag after retries"
          exit 1
