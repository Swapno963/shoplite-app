name: CI

on:
  push:
    branches:
      - main

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------
      # Hadolint
      # --------------------
      - name: Lint catalog-api Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: application/catalog-api/Dockerfile

      - name: Lint web Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: application/web/Dockerfile

      - name: Lint order-worker Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: application/order-worker/Dockerfile

      # --------------------
      # Helm lint
      # --------------------
      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: |
          helm lint helm/shoplite

      - name: Helm Template Validation
        run: |
          helm template shoplite helm/shoplite > /dev/null

      # --------------------
      # YAML lint
      # --------------------
      - name: Install yamllint
        run: |
          pip install yamllint

      - name: Run yamllint
        run: |
          yamllint .

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: application/catalog-api
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Unit Tests
        working-directory: application/catalog-api
        run: |
          pytest -v --tb=short

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: application/catalog-api
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Integration Tests
        working-directory: application/catalog-api
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: catalog
          DB_USER: postgres
          DB_PASSWORD: postgres

          REDIS_HOST: localhost
          REDIS_PORT: 6379

        run: |
          pytest -v --tb=short

  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    needs: integration-test

    outputs:
      sha: ${{ steps.vars.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Short SHA
        id: vars
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build catalog-api
        run: |
          docker build \
            -t catalog-api:${{ steps.vars.outputs.sha }} \
            ./application/catalog-api

      - name: Build web
        run: |
          docker build \
            -t web:${{ steps.vars.outputs.sha }} \
            ./application/web

      - name: Build order-worker
        run: |
          docker build \
            -t order-worker:${{ steps.vars.outputs.sha }} \
            ./application/order-worker

      - name: Show Images
        run: |
          docker images
