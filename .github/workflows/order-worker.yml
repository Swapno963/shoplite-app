name: Build Web

on:
  push:
    branches:
      - main

    paths:
      - 'application/order-worker/**'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build
        run: |
          docker build \
            -t shoplite-web:${{ github.sha }} \
            application/web

      - name: Push
        run: |
          docker tag shoplite-order-worker:${{ github.sha }} \
          051826735078.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite-order-worker:${{ github.sha }}

          docker tag shoplite-order-worker:${{ github.sha }} \
          051826735078.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite-order-worker:stable

          docker push \
          051826735078.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite-order-worker:${{ github.sha }}

          docker push \
          051826735078.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite-order-worker:stable