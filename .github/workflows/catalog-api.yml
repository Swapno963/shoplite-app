name: Build Catalog API

on:
  push:
    branches:
      - gitOps
    paths:
      - 'application/catalog-api/**'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC claims
        run: |
          python3 <<'PY'
          import base64, json, os, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(
              url,
              headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          pad = "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload + pad))
          for key in (
              "iss", "aud", "sub", "repository",
              "repository_owner", "ref", "job_workflow_ref",
          ):
              print(f"{key}={claims.get(key)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t shoplite-catalog-api:${{ github.sha }} \
            application/catalog-api

      - name: Tag and Push Docker image
        run: |
          ECR_REPOSITORY=051826735078.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite-catalog-api

          # Tag with Git commit SHA
          docker tag shoplite-catalog-api:${{ github.sha }} \
            $ECR_REPOSITORY:${{ github.sha }}

          # Tag with stable
          docker tag shoplite-catalog-api:${{ github.sha }} \
            $ECR_REPOSITORY:stable

          # Push both tags
          docker push $ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REPOSITORY:stable

      - name: Checkout GitOps
        uses: actions/checkout@v4
        with:
          repository: Swapno963/shoplite-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Bump GitOps image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cd gitops
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            current=$(yq -r '.catalogApi.image.tag' envs/dev/values.yaml)
            if [ "$current" = "$IMAGE_TAG" ]; then
              echo "GitOps already at $IMAGE_TAG"
              exit 0
            fi

            yq -i '.catalogApi.image.tag = strenv(IMAGE_TAG)' envs/dev/values.yaml
            git add envs/dev/values.yaml
            git commit -m "Bump catalog-api image to ${IMAGE_TAG}"

            if git push origin main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}, retrying..."
            sleep $((attempt * 2))
          done

          echo "Failed to push GitOps tag after retries"
          exit 1
