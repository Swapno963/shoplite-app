---
- name: Create credential provider directory
  become: true
  file:
    path: /etc/kubernetes/image-credential-provider
    state: directory
    mode: '0755'

- name: Download ECR credential provider
  become: true
  get_url:
    url: https://amazon-eks.s3.us-west-2.amazonaws.com/1.31.0/2024-09-13/bin/linux/amd64/ecr-credential-provider
    dest: /usr/local/bin/ecr-credential-provider
    mode: '0755'

- name: Create credential provider config
  become: true
  template:
    src: credential-provider-config.yaml.j2
    dest: /etc/kubernetes/image-credential-provider/config.yaml
    mode: '0644'
  notify:
    - restart kubelet

- name: Create kubelet override directory
  become: true
  file:
    path: /etc/systemd/system/kubelet.service.d
    state: directory

- name: Configure kubelet credential provider
  become: true
  copy:
    dest: /etc/systemd/system/kubelet.service.d/30-ecr-provider.conf
    content: |
      [Service]
      Environment="KUBELET_EXTRA_ARGS=--image-credential-provider-config=/etc/kubernetes/image-credential-provider/config.yaml --image-credential-provider-bin-dir=/usr/local/bin"
  notify:
    - reload systemd
    - restart kubelet