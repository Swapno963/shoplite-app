
---
aws_region: ap-southeast-1

# Must exist on artifacts.k8s.io. Many 1.32–1.35 tags 404.
# This cluster installs Kubernetes 1.37 (see kubernetes_packages defaults).
ecr_credential_provider_version: v1.37.0

ecr_credential_provider_bin_dir: /opt/kubernetes/bin

ecr_credential_provider_config_dir: /etc/kubernetes/credential-provider

ecr_credential_provider_config_file: /etc/kubernetes/credential-provider/ecr-credential-provider.yaml
