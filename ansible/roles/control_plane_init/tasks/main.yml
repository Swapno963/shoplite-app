---

- name: Verify containerd is running
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: Check whether Kubernetes is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: control_plane_initialized

- name: Initialize Kubernetes control plane
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - "--apiserver-advertise-address={{ ansible_host }}"
      - "--pod-network-cidr={{ pod_network_cidr }}"
      - "--cri-socket={{ containerd_socket }}"
  when: not control_plane_initialized.stat.exists

- name: Wait for Kubernetes API to respond
  ansible.builtin.command:
    cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes
  register: kubectl_check
  retries: 30
  delay: 10
  until: kubectl_check.rc == 0
  changed_when: false